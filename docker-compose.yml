services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: chamados_db
      POSTGRES_USER: chamados_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:-chamados_secret_2024}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chamados_user -d chamados_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend/app/uploads:/app/app/uploads

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  pgdata:
